<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:transparent; overflow:hidden; width:100vw; height:120px; }
#walker {
  position:absolute; bottom:10px; left:-100px;
  width:80px; height:80px;
  transition:none;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5));
}
#walker svg { width:80px; height:80px; }
#walker.flipped svg { transform:scaleX(-1); }
</style>
</head>
<body>
<div id="walker"><svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" id="wsv"></svg></div>
<script>
const { ipcRenderer } = require('electron');
const el = document.getElementById('walker');
const sv = document.getElementById('wsv');
let walking = false;

ipcRenderer.on('start-walk', (e, svgContent) => {
  if (walking) return;
  walking = true;
  sv.innerHTML = svgContent;
  const screenW = window.screen.width;

  // Walk left to right
  el.style.left = '-100px';
  el.classList.remove('flipped');
  el.style.transition = `left ${8 + Math.random()*4}s linear`;
  setTimeout(() => { el.style.left = (screenW + 100) + 'px'; }, 50);

  setTimeout(() => {
    // Walk right to left
    el.classList.add('flipped');
    el.style.transition = 'none';
    el.style.left = (screenW + 100) + 'px';
    setTimeout(() => {
      el.style.transition = `left ${8 + Math.random()*4}s linear`;
      el.style.left = '-100px';
    }, 100);
    setTimeout(() => { walking = false; el.style.left = '-100px'; el.style.transition='none'; }, 14000);
  }, 9500);
});
</script>
</body>
</html>
