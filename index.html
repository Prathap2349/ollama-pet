<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ollama Pet</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:transparent;
  overflow-x:hidden;overflow-y:hidden;
  font-family:'Segoe UI',sans-serif;
  user-select:none;
  width:220px;
  max-width:100vw;
}
#app{display:flex;flex-direction:column;align-items:center;}

/* CHAT BOX — sits BELOW the pet, expands downward */
#chatbox{
  width:320px;
  max-width:calc(100vw - 24px);
  background:rgba(6,6,14,0.97);
  border:1px solid rgba(255,255,255,0.1);border-radius:12px;
  padding:10px 12px;backdrop-filter:blur(24px);
  box-shadow:0 8px 32px rgba(0,0,0,0.8);
  display:none;flex-direction:column;gap:6px;
  position:relative;
  left:50%;transform:translateX(-50%);
  font-family:'Courier New',Courier,monospace;
  margin-top:4px;
  z-index:10;
}
#chatbox.open{display:flex;}

/* Fix 7: Proper top bar layout with flex spacing */
#chat-header{
  display:flex;justify-content:space-between;align-items:center;
  padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.08);
  font-family:"Courier New",Courier,monospace;
  min-height:36px;gap:6px;
}
#pet-name{font-size:13px;font-weight:700;color:rgba(255,255,255,0.9);white-space:nowrap;flex-shrink:0;}
#header-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
#mood-display{font-size:15px;line-height:1;}
#streak-badge{
  font-size:10px;background:rgba(255,255,255,0.08);border-radius:8px;
  padding:3px 7px;color:rgba(255,255,255,0.7);white-space:nowrap;
}
#close-chat{
  background:none;border:none;color:rgba(255,255,255,0.35);cursor:pointer;
  font-size:14px;padding:4px 6px;border-radius:6px;transition:all 0.15s;
  height:28px;width:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
#close-chat:hover{color:#fff;background:rgba(239,68,68,0.25);}

/* TABS */
#tabs{display:flex;gap:4px;margin-bottom:4px;}
.tab-btn{flex:1;background:rgba(255,255,255,0.05);border:none;border-radius:8px;color:rgba(255,255,255,0.4);font-size:11px;padding:5px;cursor:pointer;transition:all 0.2s;}
.tab-btn.active{background:var(--accent,rgba(99,102,241,0.5));color:#fff;}

/* PANELS */
.panel{display:none;}
.panel.active{display:flex;flex-direction:column;gap:6px;}

/* Fix 11: Dark theme contrast improvements */
#messages{flex:1;min-height:140px;max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.15) transparent;padding:4px 2px;}

/* Fix 3: Modern bubble style — no "you >" prefix */
.msg{
  padding:9px 13px;font-size:12px;line-height:1.6;max-width:88%;
  word-break:break-word;animation:fadeUp 0.18s ease;
  position:relative;white-space:pre-wrap;border-radius:16px;
  color:rgba(255,255,255,0.92);
}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* Fix 3 Option C: Cyber-style right-aligned user bubbles */
.msg.user{
  align-self:flex-end;
  background:linear-gradient(135deg,rgba(74,222,128,0.2),rgba(34,197,94,0.12));
  color:#6fefaa;
  border:1px solid rgba(74,222,128,0.3);
  border-bottom-right-radius:4px;
  font-family:'Courier New',monospace;
  margin-left:auto;
  max-width:82%;
}
/* Left-aligned bot bubbles */
.msg.bot{
  align-self:flex-start;
  background:linear-gradient(135deg,rgba(99,102,241,0.18),rgba(139,92,246,0.1));
  color:rgba(220,210,255,0.95);
  border:1px solid rgba(139,92,246,0.28);
  border-bottom-left-radius:4px;
  max-width:88%;
}
.msg.system{
  align-self:center;
  color:rgba(255,255,255,0.45);
  font-size:10px;font-style:italic;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:20px;padding:3px 10px;
}
.msg .msg-label{display:block;font-size:9px;opacity:0.5;margin-bottom:3px;font-style:normal;}
.copy-btn{position:absolute;top:5px;right:6px;background:none;border:none;color:rgba(255,255,255,0.25);cursor:pointer;font-size:9px;opacity:0;transition:opacity 0.2s;}
.msg:hover .copy-btn{opacity:1;}
.copy-btn:hover{color:rgba(255,255,255,0.85);}

/* Fix 5: Input box larger and more readable */
#input-row{
  display:flex;gap:6px;align-items:center;
  border-top:1px solid rgba(255,255,255,0.08);
  padding-top:8px;margin-top:4px;
}
#userinput{
  flex:1;background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.12);border-radius:10px;
  color:rgba(255,255,255,0.9);
  font-size:13px;padding:9px 11px;
  outline:none;font-family:"Courier New",Courier,monospace;
  min-height:40px;line-height:1.4;
  transition:border-color 0.2s;
}
#userinput:focus{border-color:var(--accent-border,rgba(99,102,241,0.5));background:rgba(255,255,255,0.06);}
#userinput::placeholder{color:rgba(255,255,255,0.28);}

/* Fix 9: Send button properly sized and styled */
#sendbtn{
  background:linear-gradient(135deg,rgba(74,222,128,0.25),rgba(34,197,94,0.15));
  border:1px solid rgba(74,222,128,0.45);border-radius:10px;
  color:#4ade80;font-size:16px;
  height:40px;padding:0 14px;
  cursor:pointer;flex-shrink:0;
  transition:all 0.15s;display:flex;align-items:center;justify-content:center;
}
#sendbtn:hover{background:rgba(74,222,128,0.3);transform:scale(1.05);}
#mic-btn{display:none;}
#mic-btn.listening{background:rgba(239,68,68,0.5);color:#fff;animation:pulse-mic 0.6s infinite;}
@keyframes pulse-mic{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* Fix 6: Consistent button heights across all action buttons */
#chat-actions{display:flex;gap:6px;margin-top:2px;}
.action-btn{
  flex:1;background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);border-radius:10px;
  color:rgba(255,255,255,0.7);font-size:10px;
  padding:0;height:36px;
  cursor:pointer;transition:all 0.2s;
  display:flex;align-items:center;justify-content:center;
  gap:3px;
}
.action-btn:hover{background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.95);}

/* STATS PANEL */
#stats-panel{gap:8px;}
#mood-bar{height:4px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;}
#mood-bar-fill{height:100%;background:var(--accent-solid,#6366f1);border-radius:2px;transition:width 0.5s;}

/* GAME PANEL */
#game-panel{align-items:center;gap:8px;}
#game-area{width:100%;height:100px;background:rgba(255,255,255,0.04);border-radius:10px;position:relative;overflow:hidden;cursor:crosshair;}
#game-target{position:absolute;width:28px;height:28px;border-radius:50%;background:var(--accent-solid,#6366f1);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:transform 0.1s;box-shadow:0 0 10px var(--accent-solid,#6366f1);}
#game-target:hover{transform:scale(1.1);}
#game-score{font-size:12px;color:rgba(255,255,255,0.6);}#game-score span{color:#fff;font-weight:700;}

/* REMINDER PANEL */
#remind-panel{gap:6px;}
#remind-input{flex:1;min-width:0;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;font-size:12px;padding:6px 10px;outline:none;}
#remind-input::placeholder{color:rgba(255,255,255,0.25);}
#remind-list{max-height:100px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
.remind-item{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.05);border-radius:8px;padding:5px 8px;font-size:11px;color:rgba(255,255,255,0.7);}
.remind-del{background:none;border:none;color:rgba(255,100,100,0.5);cursor:pointer;font-size:12px;}

/* PET STAGE — character is noticeably smaller than the 320px chat box */
#pet-wrap{position:relative;width:200px;height:140px;}
#particles{position:absolute;top:0;left:0;width:200px;height:140px;pointer-events:none;overflow:hidden;}
.particle{position:absolute;border-radius:50%;pointer-events:none;animation:pfloat linear forwards;}
@keyframes pfloat{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}}
.confetti{position:absolute;width:7px;height:7px;border-radius:2px;animation:cfall 1.1s ease-in forwards;}
@keyframes cfall{0%{opacity:1;transform:translate(0,0) rotate(0deg)}100%{opacity:0;transform:translate(var(--cx),var(--cy)) rotate(720deg)}}

#glow-ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);width:112px;height:112px;border-radius:50%;border:2px solid transparent;pointer-events:none;transition:all 0.4s;}
#glow-ring.active{border-color:var(--glow,rgba(99,102,241,0.6));box-shadow:0 0 18px var(--glow,rgba(99,102,241,0.35));animation:spin-ring 2.5s linear infinite;}
@keyframes spin-ring{from{transform:translate(-50%,-55%) rotate(0deg)}to{transform:translate(-50%,-55%) rotate(360deg)}}

#bubble{position:absolute;top:-2px;left:50%;transform:translateX(-50%);background:rgba(10,10,24,0.97);border:1px solid rgba(255,255,255,0.11);border-radius:10px;padding:5px 10px;font-size:11px;color:rgba(255,255,255,0.88);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity 0.3s;backdrop-filter:blur(12px);z-index:10;}
#bubble::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:rgba(255,255,255,0.11);border-bottom:none;}
#bubble.show{opacity:1;}

#pet-stage{width:110px;height:110px;cursor:pointer;position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);-webkit-app-region:no-drag;}
#pet-svg{width:110px;height:110px;filter:drop-shadow(0 4px 14px rgba(0,0,0,0.45));}

#statusdot{position:absolute;bottom:12px;right:16px;width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 5px #22c55e;transition:all 0.3s;}
#statusdot.thinking{background:#f59e0b;box-shadow:0 0 8px #f59e0b;animation:sdot 0.7s infinite;}
#statusdot.offline{background:#ef4444;box-shadow:0 0 5px #ef4444;}
@keyframes sdot{0%,100%{opacity:1}50%{opacity:0.2}}

#cpu-bar{position:absolute;bottom:6px;left:12px;right:30px;height:2px;background:rgba(255,255,255,0.08);border-radius:1px;overflow:hidden;}
#cpu-fill{height:100%;width:0%;background:#22c55e;border-radius:1px;transition:width 2s,background 1s;}

/* DRAG HANDLE */
#drag-handle{width:36px;height:3px;border-radius:2px;background:rgba(255,255,255,0.1);margin:3px auto 0;cursor:grab;-webkit-app-region:drag;}

/* BEAT BARS — animated when dancing is active */
@keyframes beatbar{0%,100%{height:4px}50%{height:22px}}
.beat-bar{height:4px;transition:background 0.3s;border-radius:3px;}
#game-panel.dancing .beat-bar{animation:beatbar var(--beat-dur,0.6s) ease-in-out infinite;}
#game-panel.dancing .beat-bar:nth-child(2){animation-delay:calc(var(--beat-dur,0.6s)*0.125);}
#game-panel.dancing .beat-bar:nth-child(3){animation-delay:calc(var(--beat-dur,0.6s)*0.25);}
#game-panel.dancing .beat-bar:nth-child(4){animation-delay:calc(var(--beat-dur,0.6s)*0.375);}
#game-panel.dancing .beat-bar:nth-child(5){animation-delay:calc(var(--beat-dur,0.6s)*0.5);}
#game-panel.dancing .beat-bar:nth-child(6){animation-delay:calc(var(--beat-dur,0.6s)*0.625);}
#game-panel.dancing .beat-bar:nth-child(7){animation-delay:calc(var(--beat-dur,0.6s)*0.1875);}
#game-panel.dancing .beat-bar:nth-child(8){animation-delay:calc(var(--beat-dur,0.6s)*0.4375);}

/* Music mood buttons */
.mood-music-btn{
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
  border-radius:10px;color:rgba(255,255,255,0.6);font-size:10px;
  padding:4px 9px;cursor:pointer;transition:all 0.2s;
}
.mood-music-btn:hover{background:rgba(255,255,255,0.12);color:#fff;}
.mood-music-btn.active{background:var(--accent,rgba(99,102,241,0.45));color:#fff;border-color:var(--accent-solid,#6366f1);}

/* Music upload label */
#music-upload-label{
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
  border-radius:8px;color:rgba(255,255,255,0.55);font-size:10px;
  padding:4px 9px;cursor:pointer;transition:all 0.2s;white-space:nowrap;
}
#music-upload-label:hover{background:rgba(255,255,255,0.1);color:#fff;}
#music-stop-btn{
  background:rgba(239,68,68,0.2);border:1px solid rgba(239,68,68,0.3);
  border-radius:6px;color:#f87171;font-size:10px;padding:3px 8px;cursor:pointer;
}

/* Ollama live status bar */
#ollama-status-bar{
  display:flex;align-items:center;gap:5px;
  padding:4px 8px;border-radius:8px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.07);
  font-size:10px;color:rgba(255,255,255,0.55);
  margin-bottom:2px;
}
#ollama-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 5px #22c55e;flex-shrink:0;transition:all 0.4s;}
#ollama-dot.offline{background:#ef4444;box-shadow:0 0 5px #ef4444;}
#ollama-dot.checking{background:#f59e0b;box-shadow:0 0 5px #f59e0b;animation:sdot 0.7s infinite;}
#ollama-label{flex:1;}
#ollama-retry-inline{background:none;border:none;color:rgba(255,255,255,0.35);cursor:pointer;font-size:10px;padding:0 2px;}
#ollama-retry-inline:hover{color:#fff;}

/* ALWAYS-ON-TOP INDICATOR */
#aot-badge{
  position:fixed;top:4px;left:50%;transform:translateX(-50%);
  background:rgba(99,102,241,0.7);color:#fff;font-size:9px;
  padding:2px 8px;border-radius:10px;pointer-events:none;
  opacity:0;transition:opacity 0.4s;z-index:999;font-family:'Courier New',monospace;
}
#aot-badge.show{opacity:1;}

/* HIDDEN STATE */
#app.hidden{opacity:0;pointer-events:none;}

/* Fix 10: Bottom pet navigation — more spacing and bigger icons */
#toolbar{
  display:flex;gap:8px;margin-top:5px;align-items:center;
  background:rgba(8,8,18,0.8);border-radius:22px;
  padding:6px 10px;backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.08);
}
.char-btn{
  width:34px;height:34px;border-radius:50%;
  border:2px solid rgba(255,255,255,0.12);
  background:transparent;font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;flex-shrink:0;
}
.char-btn:hover{transform:scale(1.2);border-color:rgba(255,255,255,0.45);}
.char-btn.active{border-color:var(--accent-solid,#6366f1);box-shadow:0 0 10px var(--accent-solid,#6366f1);}
#closebtn{
  width:28px;height:28px;border-radius:50%;
  border:1px solid rgba(255,255,255,0.12);background:rgba(239,68,68,0.2);
  color:rgba(255,255,255,0.55);font-size:11px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;-webkit-app-region:no-drag;flex-shrink:0;
}
#closebtn:hover{background:rgba(239,68,68,0.75);color:#fff;}
/* Fix 11: improve border contrast */
.stat-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:rgba(255,255,255,0.75);padding:4px 0;border-bottom:1px solid rgba(0,255,150,0.1);}
.stat-val{color:#fff;font-weight:600;}

/* Fix 12: Responsive widths */
@media (max-width:360px){
  #chatbox{ width:calc(100vw - 12px); padding:8px 9px; }
  body{ width:calc(100vw - 8px); }
}
@media (max-width:414px){
  #chatbox{ max-width:calc(100vw - 16px); }
}
</style>
</head>
<body>
<div id="aot-badge">📌 Always on Top — Press Alt+H to hide</div>
<div id="app">

<!-- PET — always on top of the layout -->
<div id="pet-wrap">
  <div id="particles"></div>
  <div id="glow-ring"></div>
  <div id="bubble"></div>
  <div id="pet-stage">
    <svg id="pet-svg" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div id="statusdot"></div>
  <div id="cpu-bar"><div id="cpu-fill"></div></div>
</div>

<!-- CHAT BOX — opens downward below the pet -->
<div id="chatbox">
  <div id="chat-header">
    <span id="pet-name">Mochi</span>
    <div id="header-right">
      <span id="mood-display">😸</span>
      <span id="streak-badge">🔥 0 days</span>
      <button id="close-chat">✕</button>
    </div>
  </div>

  <!-- TABS -->
  <div id="tabs">
    <button class="tab-btn active" data-tab="chat">💬 Chat</button>
    <button class="tab-btn" data-tab="stats">📊 Stats</button>
    <button class="tab-btn" data-tab="game">💃 Dance</button>
    <button class="tab-btn" data-tab="remind">⏰ Remind</button>
  </div>

  <!-- CHAT PANEL -->
  <div id="chat-panel" class="panel active">
    <div id="ollama-status-bar">
      <div id="ollama-dot"></div>
      <span id="ollama-label">Ollama: checking...</span>
      <button id="ollama-retry-inline" title="Re-check">↻</button>
    </div>
    <div id="messages"></div>
    <div id="input-row">
      <span style="color:#4ade80;font-family:'Courier New',monospace;font-size:13px;flex-shrink:0;">❯</span>
      <input id="userinput" type="text" placeholder="type here..." autocomplete="off"/>
      <button id="sendbtn" title="Send (Enter)">➤</button>
    </div>
    <div id="chat-actions">
      <button class="action-btn" id="btn-export">📄 Export</button>
      <button class="action-btn" id="btn-clear">🗑 Clear</button>
      <button class="action-btn" id="btn-walk">🚶 Walk!</button>
    </div>
  </div>

  <!-- STATS PANEL -->
  <div id="stats-panel" class="panel">
    <div class="stat-row"><span>Mood</span><span class="stat-val" id="stat-mood">Happy 😸</span></div>
    <div class="stat-row"><span>Mood Points</span><div style="flex:1;margin:0 8px"><div id="mood-bar"><div id="mood-bar-fill" style="width:100%"></div></div></div></div>
    <div class="stat-row"><span>Chats today</span><span class="stat-val" id="stat-chats">0</span></div>
    <div class="stat-row"><span>Streak</span><span class="stat-val" id="stat-streak">0 days 🔥</span></div>
    <div class="stat-row"><span>CPU load</span><span class="stat-val" id="stat-cpu">0%</span></div>
    <div class="stat-row"><span>Time</span><span class="stat-val" id="stat-time">--:--</span></div>
    <div class="stat-row"><span>Pet skin</span><span class="stat-val" id="stat-skin">Day ☀️</span></div>
  </div>

  <!-- DANCE PANEL -->
  <div id="game-panel" class="panel">
    <div id="dance-stage" style="width:100%;height:110px;background:rgba(255,255,255,0.03);border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;">
      <svg id="dance-svg" width="100" height="100" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="dance-lights" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></div>
    </div>
    <div id="dance-beat" style="display:flex;gap:3px;align-items:flex-end;justify-content:center;height:24px;">
      <div class="beat-bar" style="width:5px;background:var(--accent-solid,#6366f1);border-radius:3px;"></div>
      <div class="beat-bar" style="width:5px;background:var(--accent-solid,#6366f1);border-radius:3px;"></div>
      <div class="beat-bar" style="width:5px;background:var(--accent-solid,#6366f1);border-radius:3px;"></div>
      <div class="beat-bar" style="width:5px;background:var(--accent-solid,#6366f1);border-radius:3px;"></div>
      <div class="beat-bar" style="width:5px;background:var(--accent-solid,#6366f1);border-radius:3px;"></div>
      <div class="beat-bar" style="width:5px;background:var(--accent-solid,#6366f1);border-radius:3px;"></div>
      <div class="beat-bar" style="width:5px;background:var(--accent-solid,#6366f1);border-radius:3px;"></div>
      <div class="beat-bar" style="width:5px;background:var(--accent-solid,#6366f1);border-radius:3px;"></div>
    </div>
    <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:center;">
      <button class="mood-music-btn active" data-vibe="pop">🎵 Pop</button>
      <button class="mood-music-btn" data-vibe="rock">🤘 Rock</button>
      <button class="mood-music-btn" data-vibe="chill">😌 Chill</button>
      <button class="mood-music-btn" data-vibe="rave">⚡ Rave</button>

function renderFrame(ts){

  else if(animState==='sleep')    content=c.sleep(animTime);

  else if(animState==='dance')    content=c.dance(animTime);

}

// ══════════════════════════════════════════════
let actx=null;
function playTone(freq=800,dur=0.09,type='sine',vol=0.07){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
function playSend(){ playTone(600,0.1,'sine',0.06); }
function playReceive(){ playTone(880,0.07,'sine',0.055); setTimeout(()=>playTone(1100,0.06,'sine',0.045),85); }
function playClick(){ playTone(440,0.05,'triangle',0.05); }
function playWake(){ playTone(660,0.12,'sine',0.07); setTimeout(()=>playTone(880,0.1,'sine',0.06),120); }

function setThinking(v){
  isThinking=v;
  statusdot.className=v?'thinking':'';
  animState=v?'thinking':'idle';
  glowRing.className=v?'active':'';
}

function addMsg(text,role){
  const div=document.createElement('div');
  div.className=`msg ${role}`;
  if(role==='user'){
    // Fix 3: No "you >" prefix — clean bubble
    div.textContent=text;
  } else if(role==='bot'||role==='bot thinking'){
    // Fix 3: No "pet >" prefix
    div.textContent=text;
    if(role==='bot'){
      const btn=document.createElement('button');
      btn.className='copy-btn'; btn.textContent='⎘';
      btn.onclick=()=>{ navigator.clipboard.writeText(text); btn.textContent='✓'; setTimeout(()=>btn.textContent='⎘',1200); };
      div.appendChild(btn);
    }
  } else {
    div.textContent=text;
  }
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
  return div;
}

async function sendMessage(){
  const text=input.value.trim();
  if(!text||isThinking) return;
  // Double-click guard: disable button during generation
  const sendBtn = document.getElementById('sendbtn');
  sendBtn.disabled = true;
  input.value='';
  addMsg(text,'user');
  playSend();
  history.push({role:'user',content:text});
  setThinking(true);
  const thinking=addMsg('thinking...','bot thinking');
  try{
    const res=await fetch('http://localhost:11434/api/chat',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'llama3.2',messages:history.slice(-12),stream:false})
    });
    if(!res.ok) throw new Error('err');
    const data=await res.json();
    const reply=data.message?.content||'No response';
    thinking.remove();
    addMsg(reply,'bot');
    history.push({role:'assistant',content:reply});

// REMINDER SYSTEM
// ══════════════════════════════════════════════
const remindInput=document.getElementById('remind-input');
const remindList=document.getElementById('remind-list');

function addReminder(){
  const val=remindInput.value.trim();
  if(!val) return;
  remindInput.value='';
  // Parse time: "in X min/hour/sec" or "at HH:MM", default 5 min
  let ms=5*60000;
  const inMatch=val.match(/in\s+(\d+)\s*(min|mins|minute|minutes|hour|hours|sec|secs|second|seconds)/i);
  const atMatch=val.match(/at\s+(\d{1,2}):(\d{2})/i);
  if(inMatch){
    const num=parseInt(inMatch[1]), unit=inMatch[2].toLowerCase();
    if(unit.startsWith('sec')) ms=num*1000;
    else if(unit.startsWith('min')) ms=num*60000;
    else ms=num*3600000;
  } else if(atMatch){
    const now=new Date(), target=new Date(now);
    target.setHours(parseInt(atMatch[1]),parseInt(atMatch[2]),0,0);
    if(target<=now) target.setDate(target.getDate()+1);
    ms=target-now;
  }
  const id=Date.now();
  const remind={id,text:val,due:Date.now()+ms};
  reminders.push(remind);
  renderReminders(); saveData();
  const timer=setTimeout(()=>{
    animState='dance'; spawnConfetti(); spawnParticles(12);
    showBubble('⏰ '+val,4000);
    ipcRenderer.send('notify',{title:'⏰ Reminder!',body:val});
    playWake(); playWake();
    reminders=reminders.filter(r=>r.id!==id);
    renderReminders(); saveData();
  },ms);
  remind.timer=timer;
  showBubble('⏰ Set!',1200);
}

remindInput.addEventListener('keydown', e=>{ e.stopPropagation(); if(e.key==='Enter') addReminder(); });
remindInput.addEventListener('click', e=>e.stopPropagation());
document.getElementById('remind-add-btn').addEventListener('click', e=>{ e.stopPropagation(); addReminder(); });

function renderReminders(){
  remindList.innerHTML='';
  reminders.forEach(r=>{
    const div=document.createElement('div'); div.className='remind-item';
    const timeLeft=Math.max(0,Math.round((r.due-Date.now())/60000));
    div.innerHTML=`<span>${r.text} <span style="opacity:0.4">(${timeLeft}m)</span></span>`;
    const del=document.createElement('button'); del.className='remind-del'; del.textContent='✕';
    del.onclick=e=>{e.stopPropagation();clearTimeout(r.timer);reminders=reminders.filter(x=>x.id!==r.id);renderReminders();saveData();};
    div.appendChild(del); remindList.appendChild(div);
  });
}

function renderFrameWithDance(ts){
  animTime = ts/1000;
  const c = CHARS[currentChar];

  if     (animState==='thinking') content=c.thinking(animTime);
  else if(animState==='sleep')    content=c.sleep(animTime);

}

// ══════════════════════════════════════════════
// MUSIC BEAT DETECTION — Web Audio API on uploaded file
// ══════════════════════════════════════════════
let musicAudio = null, musicAnalyser = null, musicSource = null, musicRAF = null;

function stopMusicBeat(){
  if(musicAudio){ musicAudio.pause(); musicAudio = null; }
  if(musicSource){ try{ musicSource.disconnect(); }catch(e){} musicSource = null; }
  if(musicRAF){ cancelAnimationFrame(musicRAF); musicRAF = null; }
  musicAnalyser = null;
  // Bug 2 fix: close the old context so the next upload gets a clean one;
  // createMediaElementSource can only be called once per Audio element, and
  // a reused context may be in a bad state after the previous source was removed.
  if(actx){ try{ actx.close(); }catch(e){} actx = null; }
  document.getElementById('music-stop-btn').style.display = 'none';
  document.getElementById('music-status').textContent = '';
  // Reset beat bars to static
  document.getElementById('game-panel').classList.remove('dancing-audio');
}

document.getElementById('music-file').addEventListener('change', async e=>{
  const file = e.target.files[0];
  if(!file) return;
  stopMusicBeat();

  const url = URL.createObjectURL(file);
  musicAudio = new Audio(url);
  musicAudio.loop = true;

  // Build Web Audio analysis chain
  if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
  // Resume regardless of state — Electron renderer may suspend even on file-input change
  try { await actx.resume(); } catch(_) {}
  musicSource   = actx.createMediaElementSource(musicAudio);
  musicAnalyser = actx.createAnalyser();
  musicAnalyser.fftSize = 256;
  musicSource.connect(musicAnalyser);
  musicAnalyser.connect(actx.destination);

  // Play after full chain is wired; catch autoplay rejections gracefully
  const stopClick = e => { e.stopPropagation(); stopMusicBeat(); if(animState==='dance') animState='idle'; };
  try { await musicAudio.play(); } catch(err) {
    document.getElementById('music-status').textContent = '⚠ Click ▶ to start';
    document.getElementById('music-stop-btn').style.display = 'inline-block';
    document.getElementById('music-stop-btn').textContent = '▶ Play';
    document.getElementById('music-stop-btn').onclick = async ev => {
      ev.stopPropagation();
      try { await actx.resume(); await musicAudio.play(); } catch(_) {}
      document.getElementById('music-stop-btn').textContent = '■ Stop';
      document.getElementById('music-stop-btn').onclick = stopClick;
    };
    return;
  }
  document.getElementById('music-stop-btn').onclick = stopClick;
  document.getElementById('music-status').textContent = '♪ ' + file.name.slice(0,28);
  document.getElementById('music-stop-btn').style.display = 'inline-block';

  // Ensure dance tab is active and pet is dancing
  if(animState !== 'dance') animState = 'dance';
  // Bug 3 fix: .dancing must be present for beat-bar CSS animations to fire,
  // but it was only added via the tab click handler. Add it here too.
  document.getElementById('game-panel').classList.add('dancing');

  const beatBars   = document.querySelectorAll('#dance-beat .beat-bar');
  const dataArray  = new Uint8Array(musicAnalyser.frequencyBinCount);
  let   lastBeat   = 0, beatThreshold = 160;
  // Bug 4 fix: track last vibe so setDanceVibe (which calls showBubble + playTone)
  // only fires on a real change, not on every animation frame (~60×/s).
  let   lastVibe   = null;

  function driveBeatBars(){
    musicRAF = requestAnimationFrame(driveBeatBars);
    musicAnalyser.getByteFrequencyData(dataArray);
    // Use bands across spectrum to drive each bar independently
    const bands = 8;
    const binsPerBand = Math.floor(dataArray.length / bands);
    beatBars.forEach((bar, i)=>{
      const start = i * binsPerBand;
      let sum = 0;
      for(let j=start; j<start+binsPerBand; j++) sum += dataArray[j];
      const avg = sum / binsPerBand;
      const h = Math.max(3, Math.round((avg/255)*28));
      bar.style.height = h + 'px';
    });

    // Beat detection: big bass spike → flash pet
    const bass = dataArray.slice(0, 8).reduce((a,b)=>a+b,0)/8;
    const now = performance.now();
    if(bass > beatThreshold && now - lastBeat > 200){
      lastBeat = now;
      spawnParticles(3, CHARS[currentChar].accentSolid);
    }
    // Auto-detect tempo from bass energy and set vibe — only when it changes
    const nextVibe = bass > 200 ? 'rave' : bass > 150 ? 'rock' : bass > 80 ? 'pop' : 'chill';
    if(nextVibe !== lastVibe){ lastVibe = nextVibe; setDanceVibe(nextVibe); }
  }
  driveBeatBars();
  showBubble('🎧 Dancing to music!', 2000);
});

document.getElementById('music-stop-btn').addEventListener('click', e=>{
  e.stopPropagation(); stopMusicBeat();
  if(animState==='dance') animState='idle';
});
